[package]
name = "pgdrop"
description = "pgrust in one self-contained binary: initdb, psql, postgres, start"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# Links pgrust (AGPL-3.0), so this crate is AGPL too; see ADR-0003 and ./LICENSE.
# `license` only: AGPL-3.0-only is a standard SPDX expression, and setting
# `license-file` as well makes cargo warn on every build. The AGPL text stays at
# ./LICENSE, where ADR-0003 and NOTICE.md point.
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pgdrop"
path = "src/main.rs"

# NAT-410: startup time and binary size. `harness = false`: it prints a
# report rather than running tests. CI runs it with `cargo test --bench
# startup`, which builds it in the test (dev) profile it measures.
[[bench]]
name = "startup"
harness = false

[dependencies]
usage = { workspace = true }
rinitdb = { workspace = true }
rpsql = { workspace = true }
# Workspace-internal (MIT, ported from C; already in the build through rpsql):
# `start` waits for the server by connecting until ReadyForQuery (NAT-409).
rlibpq = { workspace = true }
# `start --foreground` forwards SIGINT/SIGTERM/SIGHUP/SIGQUIT to the server
# (NAT-409). Already in pgdrop's tree, through rpsql only (ADR-0009); the
# direct edge awaits the owner's approval, see ADR-0009's amendment.
signal-hook = { workspace = true }
main_main = { workspace = true }
seams_init = { workspace = true }
ipc = { workspace = true }
elog = { workspace = true }

[dev-dependencies]
testkit = { workspace = true }

[lints]
workspace = true
