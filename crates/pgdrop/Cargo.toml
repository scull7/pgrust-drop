[package]
name = "pgdrop"
description = "pgrust in one self-contained binary: initdb, psql, postgres, start"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
# Links pgrust (AGPL-3.0), so this crate is AGPL too; see ADR-0003 and ./LICENSE.
# `license` only: AGPL-3.0-only is a standard SPDX expression, and setting
# `license-file` as well makes cargo warn on every build. The AGPL text stays at
# ./LICENSE, where ADR-0003 and NOTICE.md point.
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[[bin]]
name = "pgdrop"
path = "src/main.rs"

[dependencies]
usage = { workspace = true }
rinitdb = { workspace = true }
rpsql = { workspace = true }

[dev-dependencies]
testkit = { workspace = true }
# Workspace-internal, test-only: tests/pg_config_agreement.rs compares
# rinitdb's pg_config constants with rlibpq's (NAT-428). rlibpq is already in
# the build through rpsql; this edge only makes it nameable from a test.
rlibpq = { workspace = true }

[lints]
workspace = true
