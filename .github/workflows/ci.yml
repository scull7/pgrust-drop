name: ci

# Lane order is deliberate (ADR-0007): musl is the product's primary target and
# runs on every push; gnu and apple only run on pull requests, and only once
# musl is green.
#
# Job names are the status-check names the `main` ruleset requires, so they stay
# plain and stable: musl, apple, gnu. All three are required, not only gnu --
# GitHub counts a `skipped` check as successful, and a job skipped because its
# `needs:` failed does not block a merge. Requiring musl, which always runs on a
# pull request, is what makes a red musl lane actually stop the merge.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A byte-diff gate that cannot find its reference binary prints SKIP and
  # passes, which is indistinguishable from a green gate in the CI summary. In
  # CI a missing reference is a failure.
  PGDROP_REQUIRE_REF: 1

jobs:
  musl:
    runs-on: ubuntu-latest
    # GitHub offers no Alpine runner image; a container is the supported way to
    # get a musl userland. This is CI configuration only: nothing in the
    # product or the developer workflow may require a container runtime.
    container: alpine:3.21
    steps:
      - name: Install the Alpine toolchain
        run: apk add --no-cache bash build-base curl git libstdc++ musl-dev tar unzip xz
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -fsSL --retry 3 https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.96.0 \
            --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Fetch the musl reference binaries
        run: ./scripts/fetch-ref-binaries.sh --lane musl >> "$GITHUB_ENV"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - name: test
        run: cargo test --all-features

  apple:
    needs: musl
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the Darwin reference binaries
        run: ./scripts/fetch-ref-binaries.sh --lane apple >> "$GITHUB_ENV"
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - name: test
        run: cargo test --all-features

  gnu:
    needs: musl
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the glibc reference binaries
        run: ./scripts/fetch-ref-binaries.sh --lane gnu >> "$GITHUB_ENV"
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      # The whole premise of this repo is byte-diffing our tools against the
      # real C ones, so CI must actually have them. Without this step every
      # byte-diff gate prints `SKIP (flagged, not silent)` and passes, and the
      # suite is green while proving nothing.
      #
      # postgresql-18 + postgresql-client-18 put these under
      # /usr/lib/postgresql/18/bin (PGDG's Debian/Ubuntu layout — versioned
      # bindir, with /usr/bin holding only pg_wrapper symlinks):
      #   initdb, pg_ctl, pg_controldata, pg_checksums, postgres  (server pkg)
      #   psql                                                    (client pkg)
      # so the gates driving those tools become real here.
      #
      # NOT covered: `libpq_uri_regress` is a PostgreSQL *test* program built
      # from src/interfaces/libpq/test/ and is shipped by no PGDG package, so
      # the rlibpq URI gate keeps flagged-skipping until something builds it
      # from source (NAT-374). testkit's UNSHIPPED_TOOLS exempts it by name;
      # every other tool is required below.
      - name: install PostgreSQL 18 reference binaries (PGDG)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
      # Fail here rather than three minutes later inside a gate, and branch on
      # each command's exit status — never on grepped output (AGENTS.md).
      - name: verify the reference binaries are where the gates look
        run: |
          set -euo pipefail
          for tool in initdb pg_ctl pg_controldata pg_checksums psql; do
            test -x "/usr/lib/postgresql/18/bin/$tool"
          done
          /usr/lib/postgresql/18/bin/initdb --version
          /usr/lib/postgresql/18/bin/psql --version
      # PGDROP_REQUIRE_REF turns a missing reference from a flagged skip that
      # passes into a hard failure, so a gate can never silently stop running
      # here. Not `-- --ignored`: the one #[ignore]d test (psql
      # program_help_ok, NAT-399) is a known-unimplemented feature.
      - name: test
        env:
          PGDROP_REF_BIN: /usr/lib/postgresql/18/bin
          PGDROP_REQUIRE_REF: "1"
        run: cargo test --all-features
