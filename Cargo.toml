[workspace]
resolver = "2"
members = [
    "crates/testkit",
    "crates/rinitdb",
    "crates/rlibpq",
    "crates/rlibpq/ffi",
    "crates/rpsql",
    "crates/pgdrop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/scull7/pgrust-drop"
publish = false
# Per-crate `license` is set in each manifest (ADR-0003): MIT for the ports, AGPL-3.0-only for pgdrop.

[workspace.dependencies]
# All CLIs use usage-rs (owner decision, 2026-09-16). Aliased to `usage` in each crate.
usage = { package = "usage-rs", version = "6" }
thiserror = "2"
# rpsql's SIGINT handler (owner, 2026-09-27; ADR-0009).
signal-hook = "0.3"
# rlibpq's readiness wait, `rustix::event::poll` (owner, 2026-09-27; ADR-0010).
rustix = { version = "1", default-features = false, features = ["event", "std"] }

testkit = { path = "crates/testkit" }
rinitdb = { path = "crates/rinitdb" }
rlibpq = { path = "crates/rlibpq" }
rpsql = { path = "crates/rpsql" }

# pgrust's server, a rev-pinned Cargo git dependency (ADR-0001). AGPL-3.0, so
# only pgdrop may depend on it (ADR-0003; scripts/check-license-wall.sh). The
# pin is scull7's fork: malisper/pgrust 79ad992 (v0.3) plus the musl build fix
# and its getrandom EINTR/short-read retry, on branch `musl-build`, pending
# upstream (ADR-0001, amendment 2026-09-23).
# Bump with scripts/pgrust-rev.sh.
main_main = { git = "https://github.com/scull7/pgrust", rev = "75f1d3985d9841de3ddfa8c139ca308df0f80fcd" }
# Three more crates of the same pin, for what `main_main`'s own bin/postgres.rs
# does around `pg_main` and pgdrop's `postgres` applet has to do too: install
# the seams (seams_init), turn the `ProcExitThread` unwind into an exit status
# (ipc) and report an unhandled error (elog). Already in pgdrop's tree through
# main_main; scripts/pgrust-rev.sh moves every pgrust line together.
seams_init = { git = "https://github.com/scull7/pgrust", rev = "75f1d3985d9841de3ddfa8c139ca308df0f80fcd" }
ipc = { git = "https://github.com/scull7/pgrust", rev = "75f1d3985d9841de3ddfa8c139ca308df0f80fcd" }
elog = { git = "https://github.com/scull7/pgrust", rev = "75f1d3985d9841de3ddfa8c139ca308df0f80fcd" }
# And three for the allocator hooks bin/postgres.rs installs beside mimalloc
# (NAT-407): the memory-context release hook (mcx), the watchdog's allocator
# statistics (memwatchdog) and the QoS governor's usage probe (runtime).
mcx = { git = "https://github.com/scull7/pgrust", rev = "75f1d3985d9841de3ddfa8c139ca308df0f80fcd" }
memwatchdog = { git = "https://github.com/scull7/pgrust", rev = "75f1d3985d9841de3ddfa8c139ca308df0f80fcd" }
runtime = { git = "https://github.com/scull7/pgrust", rev = "75f1d3985d9841de3ddfa8c139ca308df0f80fcd" }
# Registry crates main_main already links (its Cargo.toml asks for these
# exact requirements), named by pgdrop for what bin/postgres.rs does with
# them: mimalloc as the global allocator and its extended C API for the hooks
# above; libc for the stack rlimit and the signal mask (NAT-407). Inside the
# pgrust tree the owner approved for pgdrop (2026-09-23); no new crate.
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
libc = "0.2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Upstream-fidelity code carries many short `initdb.c`-style names; module docs cover them.
module_name_repetitions = "allow"
# Proper nouns (PostgreSQL, SCRAM-SHA-256, libpq …) appear in every doc comment; backticking
# them would read as code. Identifiers in prose are still backticked by convention.
doc_markdown = "allow"

# pgrust is ~870 crates. Full debuginfo for all of them made a debug target/ of
# ~11 GB, over GitHub's 10 GB per-repository cache budget on its own; line
# tables keep file:line in a pgrust backtrace at a fraction of the size. Our
# own crates keep the default full debuginfo.
[profile.dev.package."*"]
debug = "line-tables-only"
