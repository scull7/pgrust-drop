name: ci

# Lane order is deliberate (ADR-0007): musl is the product's primary target and
# runs first; gnu and apple only start once musl is green. All three run on a
# pull request, on a push to main and on the schedule below (ADR-0007,
# amendment of 2026-09-26): a pull request can restore only its own caches and
# main's, so a lane main never runs has no cache any new pull request can use,
# and it compiled pgrust from scratch on every one (NAT-598).
#
# Job names are the status-check names the `main` ruleset requires, so they stay
# plain and stable: musl, apple, gnu. All three are required, not only gnu --
# GitHub counts a `skipped` check as successful, and a job skipped because its
# `needs:` failed does not block a merge. Requiring musl, which always runs on a
# pull request, is what makes a red musl lane actually stop the merge.
#
# Reference binaries (ADR-0007, amendment of 2026-09-18): every lane installs
# one complete PostgreSQL 18 from its platform's packages and points its lane
# variable at that tree. The Maven bundles scripts/fetch-ref-binaries.sh gets
# for a laptop ship only initdb, postgres and pg_ctl, but the gates also drive
# psql, pg_controldata and pg_checksums, and a cluster gate insists on every
# tool coming from one tree -- so a lane that mixed the bundle with a package
# would compare two servers. The whole premise of this repo is byte-diffing our
# tools against the real C ones, so CI must actually have all of them.
#
# NOT covered anywhere: `libpq_uri_regress` is a PostgreSQL *test* program built
# from src/interfaces/libpq/test/ and shipped by no package, so the rlibpq URI
# gate keeps flagged-skipping until something builds it from source (NAT-374).
# testkit's UNSHIPPED_TOOLS exempts it by name; every other tool is required.
#
# pgrust (ADR-0001, amendment of 2026-09-23): pgdrop depends on pgrust's
# `main_main`, ~870 crates from a 727 MB git repository. Cold, that is roughly
# 3-4 minutes of compilation per build flavour (clippy's check and the test
# build are separate) on a 4-core runner, plus the clone; warm, every lane
# restores ~/.cargo (registry + git) and target/ from Swatinem/rust-cache and
# compiles none of it. Budget (NAT-598): every lane under 5 minutes warm. A
# cold lane cannot meet that on a standard runner -- two build flavours of the
# pgrust tree are 4-6 minutes of compilation alone -- so the caches are kept
# from going cold instead: main saves one per lane, a pull request that does
# not change a manifest restores it by exact key and saves nothing, and the
# schedule restores them often enough that GitHub's 7-day eviction never fires.

on:
  push:
    branches: [main]
  pull_request:
  # Keep-warm (NAT-598): GitHub evicts a cache nobody has restored for 7 days.
  # A scheduled run is on main, restores main's three caches by exact key and
  # so saves nothing; twice a week keeps every gap under 7 days.
  schedule:
    - cron: '17 5 * * 1,4'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A byte-diff gate that cannot find its reference binary prints SKIP and
  # passes, which is indistinguishable from a green gate in the CI summary. In
  # CI a missing reference is a failure. Not `-- --ignored`: the one
  # #[ignore]d test (psql program_help_ok, NAT-399) is a known-unimplemented
  # feature.
  PGDROP_REQUIRE_REF: 1
  # pgrust's regexp_alt links RE2 when libre2 is installed and otherwise, in a
  # dev profile, falls back to its Spencer-only engine with a warning (release
  # profiles refuse to build without RE2). CI builds dev profiles only and
  # takes the fallback on every lane deliberately, instead of depending on
  # whether a runner image happens to ship libre2. A release build with RE2 is
  # later work (ADR-0001, amendment of 2026-09-23).
  PGRUST_FORCE_NO_RE2: 1
  # The pgrust repository is large; the git CLI fetches it faster than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  musl:
    runs-on: ubuntu-latest
    # GitHub offers no Alpine runner image; a container is the supported way to
    # get a musl userland. This is CI configuration only: nothing in the
    # product or the developer workflow may require a container runtime.
    # 3.23 is the first Alpine release whose community repository carries
    # postgresql18.
    container: alpine:3.23
    # Rust lives under /__w, the runner's work directory, which GitHub
    # bind-mounts into the container, and not in the container's own overlay
    # layer (NAT-598). CARGO_HOME holds the restored registry and the pgrust git
    # database: written into the overlay layer, unpacking the cache took twice
    # as long as on gnu, and `docker rm` at the end of the job then spent
    # 37-55 s deleting it all again.
    env:
      RUSTUP_HOME: /__w/_rust/rustup
      CARGO_HOME: /__w/_rust/cargo
      PGDROP_REF_BIN_MUSL: /usr/libexec/postgresql18
    steps:
      # zstd is for Swatinem/rust-cache, not the build: actions/cache compresses
      # with zstd only if a `zstd` binary is on PATH and otherwise falls back to
      # gzip, which on this ~700 MB cache took 91 s to save and 49 s to unpack
      # (NAT-598). With zstdmt both are a few seconds, as on the other lanes.
      - name: Install the Alpine toolchain and the PostgreSQL 18 reference
        run: |
          apk add --no-cache bash build-base curl git libstdc++ linux-headers musl-dev \
            perl tar unzip xz zstd postgresql18 postgresql18-client
      - uses: actions/checkout@v4
      # Toolchain in a shared, world-writable prefix (as the official rust
      # image does under /usr/local) so the unprivileged user below can run
      # cargo.
      - name: Install Rust
        run: |
          curl -fsSL --retry 3 https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.96.0 \
            --component rustfmt,clippy --no-modify-path
          chmod -R a+w "$RUSTUP_HOME" "$CARGO_HOME"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      # Restores ~/.cargo (registry, and the pgrust clone under git/) and
      # target/. It runs as root, so the next step hands the restored trees to
      # the unprivileged user.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The container's steps run as root, and C initdb and postgres refuse to
      # run as root ("cannot be run as root"), so every gate that creates a
      # cluster would compare two refusals. The checks run as an ordinary user;
      # su without -p also gives that user its own HOME, USER and LOGNAME, which
      # is what C initdb's getpwuid answer is compared against.
      - name: Create the unprivileged user the gates run as
        run: |
          adduser -D ci
          chown -R ci "$GITHUB_WORKSPACE" "$CARGO_HOME"
      # Fail here rather than three minutes later inside a gate, and branch on
      # each command's exit status -- never on grepped output (AGENTS.md).
      - name: verify the reference binaries are where the gates look
        run: |
          set -euo pipefail
          for tool in initdb pg_ctl postgres pg_controldata pg_checksums psql; do
            test -x "$PGDROP_REF_BIN_MUSL/$tool"
          done
          "$PGDROP_REF_BIN_MUSL/initdb" --version
          "$PGDROP_REF_BIN_MUSL/psql" --version
      # Its own step so the run's timings show the network apart from the
      # checks: cold, this clones the 727 MB pgrust repository (30-110 s, which
      # used to be billed to the license wall); warm, ~/.cargo/git is restored
      # and it fetches nothing.
      - name: fetch dependencies
        run: su -c 'cargo fetch --locked' ci
      - name: fmt
        run: su -c 'cargo fmt --all --check' ci
      - name: license wall (no pgrust crate reachable from an MIT crate)
        run: su -c 'scripts/check-license-wall.sh' ci
      - name: clippy
        run: su -c 'cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic' ci
      - name: test
        run: su -c 'cargo test --all-features' ci

  apple:
    needs: musl
    runs-on: macos-15
    env:
      PGDROP_REF_BIN_APPLE: /opt/homebrew/opt/postgresql@18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install the PostgreSQL 18 reference (Homebrew)
        run: brew install postgresql@18
      - name: verify the reference binaries are where the gates look
        run: |
          set -euo pipefail
          for tool in initdb pg_ctl postgres pg_controldata pg_checksums psql; do
            test -x "$PGDROP_REF_BIN_APPLE/$tool"
          done
          "$PGDROP_REF_BIN_APPLE/initdb" --version
          "$PGDROP_REF_BIN_APPLE/psql" --version
      - name: fetch dependencies
        run: cargo fetch --locked
      - name: license wall (no pgrust crate reachable from an MIT crate)
        run: scripts/check-license-wall.sh
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - name: test
        run: cargo test --all-features

  gnu:
    needs: musl
    runs-on: ubuntu-latest
    env:
      PGDROP_REF_BIN_GNU: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # postgresql-18 + postgresql-client-18 put these under
      # /usr/lib/postgresql/18/bin (PGDG's Debian/Ubuntu layout -- versioned
      # bindir, with /usr/bin holding only pg_wrapper symlinks):
      #   initdb, pg_ctl, pg_controldata, pg_checksums, postgres  (server pkg)
      #   psql                                                    (client pkg)
      - name: Install the PostgreSQL 18 reference (PGDG)
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
      - name: verify the reference binaries are where the gates look
        run: |
          set -euo pipefail
          for tool in initdb pg_ctl postgres pg_controldata pg_checksums psql; do
            test -x "$PGDROP_REF_BIN_GNU/$tool"
          done
          "$PGDROP_REF_BIN_GNU/initdb" --version
          "$PGDROP_REF_BIN_GNU/psql" --version
      - name: fetch dependencies
        run: cargo fetch --locked
      - name: fmt
        run: cargo fmt --all --check
      - name: license wall (no pgrust crate reachable from an MIT crate)
        run: scripts/check-license-wall.sh
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic
      - name: test
        run: cargo test --all-features
