[workspace]
resolver = "2"
members = [
    "crates/testkit",
    "crates/rinitdb",
    "crates/rlibpq",
    "crates/rpsql",
    "crates/pgdrop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/scull7/pgrust-drop"
publish = false
# Per-crate `license` is set in each manifest (ADR-0003): MIT for the ports, AGPL-3.0-only for pgdrop.

[workspace.dependencies]
# All CLIs use usage-rs (owner decision, 2026-09-16). Aliased to `usage` in each crate.
usage = { package = "usage-rs", version = "6" }
thiserror = "2"

testkit = { path = "crates/testkit" }
rinitdb = { path = "crates/rinitdb" }
rlibpq = { path = "crates/rlibpq" }
rpsql = { path = "crates/rpsql" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Upstream-fidelity code carries many short `initdb.c`-style names; module docs cover them.
module_name_repetitions = "allow"
# Proper nouns (PostgreSQL, SCRAM-SHA-256, libpq …) appear in every doc comment; backticking
# them would read as code. Identifiers in prose are still backticked by convention.
doc_markdown = "allow"
